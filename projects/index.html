    <body>

    <nav class="header">

            <li><a href="/">Home</a></li>
            <li><a href="/projects">Projects</a></li>
            <li><button id="theme-toggle" class="project-button">
                <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>

                <!-- Moon icon (shown in light mode, click to go dark) -->

        <div class="flex-container">
            <div class="column" style="max-width: 60%">
                <div id="content">

                    <script>
                        // Files to render
                        const md_files = [
                            "00-hardware.md",
                            "01-maze-robot.md",
                            "02-sar-adc.md"
                        ]

                        function slugify(text) {
                            return text
                                .toLowerCase()
                                .trim()
                                .replace(/[^\w\s-]/g, '')   // strip punctuation
                                .replace(/\s+/g, '-');     // spaces -> dashes
                        }

                        const renderer = new marked.Renderer();
                        renderer.heading = function (text, level) {
                            const id = slugify(text);
                            return `<h${level} id="${id}">${text}</h${level}>\n`;
                        };

                        renderer.link = function (href, title, text) {
                            return `<a href="${href}" target="_blank" rel="noopener noreferrer"${title ? ` title="${title}"` : ''}>${text}</a>`;
                        };

                        Promise.all(
                            md_files.map(file => fetch("content/"+file)
                                .then(res => res.text()))
                        ).then(md_contents => {
                        md_contents.forEach((md, i) => {
                            const section = document.createElement('div');
                            section.className = 'md-section';
                            section.dataset.source = "content/"+md_files[i];
                            section.innerHTML = marked.parse(md, { renderer });
                            document.getElementById('content').appendChild(section);
                            });
                        });
                    </script>

                </div>
            </div>
            <ul class="article-list">

                </ul>
